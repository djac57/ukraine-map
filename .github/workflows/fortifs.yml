# Fortifications tracées par Playfra (X @Playfra0, Telegram t.me/PlayfraOSINT ; accord écrit du 22-23/11/2026) :
# téléchargement hebdomadaire du GeoJSON public (github.com/playframap/playframap.github.io), simplification, publication
# dans site/fortifs_playfra.js (calque « fortifications (@Playfra) ») et data/fortifs_playfra.json (lu par
# sectors.fortifs pour P(mouvement)). Objets non datés : instantané du jour.
name: "Fortifications Playfra (hebdomadaire)"
on:
  schedule:
    - cron: "30 4 * * 1"        # le lundi, avant la mise à jour de 15 h
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: fortifs
  cancel-in-progress: false
jobs:
  fortifs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: "Télécharger et simplifier les tracés Playfra"
        run: python scripts/build_fortifs.py
      - name: "Garde-fou : pas de recul brutal du nombre de fossés"
        run: |
          python - <<'EOF'
          import json, subprocess, sys
          new = json.load(open("data/fortifs_playfra.json"))["n"]
          try:
              old = json.loads(subprocess.check_output(["git", "show", "HEAD:data/fortifs_playfra.json"]))["n"]
          except Exception:
              sys.exit(0)
          for k, v in old.items():
              if new.get(k, 0) < 0.8 * v:
                  print(f"{k} : {new.get(k, 0)} contre {v} publiés (recul > 20 %), on garde la version publiée")
                  for f in ("data/fortifs_playfra.json", "site/fortifs_playfra.js"):
                      open(f, "wb").write(subprocess.check_output(["git", "show", "HEAD:" + f]))
                  break
          EOF
      - name: "Empreintes de cache"
        run: python scripts/stamp.py
      - name: "Versionner"
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data/fortifs_playfra.json site/fortifs_playfra.js site/*.html site/app.js
          git diff --cached --quiet || git commit -m "Fortifications Playfra : instantané hebdomadaire"
          git pull --rebase
          git push
