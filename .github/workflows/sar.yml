# Indices radar Sentinel-1 par maille de 2 km, une fois par mois, sans compte ni secret.
# Données : Copernicus Sentinel-1 (ESA) via Microsoft Planetary Computer ; ESA WorldCover 2021 (CC BY 4.0) ;
# ERA5 via Open-Meteo (CC BY 4.0). Mention à afficher : « Contient des données Copernicus Sentinel modifiées [années] ».
name: "SAR mensuel"
on:
  schedule:
    - cron: "0 2 9 * *"        # le 9 : le mois précédent est terminé depuis au moins 7 jours
  workflow_dispatch:
    inputs:
      month:
        description: "Mois AAAA-MM (vide : dernier mois terminé depuis 7 jours)"
        required: false
permissions:
  contents: write
concurrency:
  group: sar
  cancel-in-progress: false
jobs:
  sar:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: "Dépendances"
        run: pip install numpy scipy rasterio pystac-client planetary-computer
      - name: "Indices SAR (fenêtre ±15 km autour de la ligne)"
        run: python scripts/sar_update.py --root . --radius 15 --workers 12 --out data/sar_cells.csv ${{ inputs.month && format('--month {0}', inputs.month) || '' }}
      - name: "Versionner"
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data/sar_cells.csv
          git diff --cached --quiet || git commit -m "SAR : indices radar du mois (Copernicus Sentinel-1)"
          git pull --rebase
          git push
