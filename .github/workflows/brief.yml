# Brief quotidien « ce qui se passe au sol » : extrait NOS détections (flèches poussée possible/probable) du mois courant
# via Playwright (diagnostic __uafArrows de la carte) et écrit site/brief.js, affiché en haut de la carte.
# Colonne vertébrale DÉTERMINISTE (fiable, gratuite) + couche TENDANCE best-effort : un appel Gemini free-tier/jour lit
# la trajectoire mensuelle de NOS signaux et ajoute une phrase de tendance (4 langues). Sans clé/échec → brief seul.
# Tourne APRÈS l'update du matin (données fraîches déjà commitées).
name: brief-quotidien
on:
  schedule: [{ cron: "0 6 * * *" }]   # GitHub retarde ~5 h → ~11 h UTC, après le déploiement de l'update du matin
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: [scripts/build_brief.py, scripts/gemini_client.py]
permissions: { contents: write }
concurrency: { group: brief, cancel-in-progress: false }

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: "Dépendances (Playwright + Chromium)"
        run: |
          python -m pip install --disable-pip-version-check playwright==1.48.0
          python -m playwright install --with-deps chromium
      - name: "Générer le brief (nos détections → site/brief.js)"
        run: python scripts/build_brief.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}   # couche tendance best-effort ; absent → brief déterministe seul
      - name: "Commit du brief si changé"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add site/brief.js site/index.html
          git diff --cached --quiet && { echo "rien à committer"; exit 0; }
          git commit -m "Brief quotidien : détections du jour"
          git pull --rebase --autostash origin main || true
          git push
