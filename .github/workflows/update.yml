# Mise à jour quotidienne (FIRMS, VIINA, WarSpotting, Oryx, missiles, UCDP, signaux Telegram) puis publication sur Pages.
# - schedule / workflow_dispatch : récupération, construction, commit des sorties, déploiement ;
# - push : déploiement seul (aucune récupération ni construction), sauf commit dont le message contient [build].
# Secret requis : FIRMS_MAP_KEY. Le dossier raw/ n'est jamais versionné : il vit dans le cache Actions,
# sauvegardé même si une étape échoue ou expire, pour que le passage suivant reprenne là où il s'est arrêté.
# Les scripts build*.py refusent d'écraser une sortie publiée par une version plus pauvre (code 3).
#
# build_front.py est PARALLÉLISÉ par LOT (docs/ETAT.md § 8) : le job « collecte » récupère et construit les couches
# légères (artefact « work » = site/ + data/) ; la matrice « front » calcule chaque lot sur un runner (FRONT_VIEWS) et
# en publie les morceaux (front_parts.py stage) ; le job « assemble » les recolle (front_parts.py assemble) en un front.js
# OCTET POUR OCTET identique au passage unique, puis enchaîne direction/fusion/kmchange/avancée, les contrôles et le commit.
name: mise-a-jour
on:
  push:
    branches: [main]
  schedule: [{ cron: "0 0 * * *" }, { cron: "0 13 * * *" }]   # GitHub retarde les crons de ~5 h : "0 0" part en réalité ~05 h UTC → J-1 publié ~06 h Paris (avant 7 h) ; "0 13" → ~18 h UTC. Tout sur le cloud, rien en local.
  workflow_dispatch: {}
permissions: { contents: write, pages: write, id-token: write }
concurrency: { group: "mise-a-jour-${{ github.ref_name }}", cancel-in-progress: false }   # par branche : un run de test (cloud-migration) ne bloque pas celui de main

jobs:
  collecte:
    # push : déploiement seul, SAUF si le message du commit contient [build] (relance manuelle sans jeton GitHub)
    if: github.event_name != 'push' || contains(github.event.head_commit.message, '[build]')
    runs-on: ubuntu-latest   # GitHub cloud — plus de dépendance au Mac. setup-python fournit Python 3.12 ; Chrome préinstallé. Le contrôle i18n (rendu UK/RU) est délégué à controle-i18n.yml (UAF_SKIP_I18N dans assemble)
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: "Dépendances (nowcast : calcul matriciel ; PyYAML : validation des workflows)"
        run: python -m pip install --disable-pip-version-check numpy==2.3.5 scipy==1.16.3 pyarrow==21.0.0 pyyaml
      - name: Restaurer le cache des données brutes
        uses: actions/cache/restore@v4
        with: { path: raw, key: "raw-${{ github.run_id }}", restore-keys: "raw-" }

      - name: FIRMS (archives, API de l'année, flux 7 jours)
        run: python scripts/fetch.py raw --api --nrt
        env: { FIRMS_MAP_KEY: "${{ secrets.FIRMS_MAP_KEY }}" }
        timeout-minutes: 35
        continue-on-error: true
      - name: OSINT (VIINA, UCDP, Oryx, missiles, WarSpotting — reprise incrémentale)
        run: python scripts/fetch_osint.py raw
        timeout-minutes: 45
        continue-on-error: true
      - name: Annonces officielles (MoD RF, état-major ukrainien — reprise incrémentale)
        run: python scripts/fetch_claims.py raw
        timeout-minutes: 60
        continue-on-error: true
      - name: "Bilans et annonces du MoD RF repris par Interfax et RIA Novosti (citations seulement, reprise incrémentale ; rattrapage depuis mars en quelques passages)"
        run: python scripts/fetch_mod_bulletins.py raw --since 2026-03-01 --sources interfax,ria --budget 25
        timeout-minutes: 30
        continue-on-error: true
      - name: "Bilans du MoD RF : drones ukrainiens interceptés par région (reprise incrémentale)"
        run: python scripts/fetch_mod_drones.py raw --recent
        timeout-minutes: 40
        continue-on-error: true
      - name: "alerts.in.ua : menaces d'artillerie (sauté sans le secret ALERTS_IN_UA_TOKEN)"
        run: python scripts/fetch_alerts_in_ua.py raw
        env:
          ALERTS_IN_UA_TOKEN: ${{ secrets.ALERTS_IN_UA_TOKEN }}
        timeout-minutes: 10
        continue-on-error: true
      - name: Journal public de DeepStateMap (déclarations datées, faits seulement)
        run: python scripts/fetch_dsmlog.py raw/viina
        timeout-minutes: 5
        continue-on-error: true
      - name: "Telegram : 15 canaux publics, 45 derniers jours (aperçu t.me/s, sans compte ; textes gardés dans raw/ seulement)"
        run: python scripts/fetch_telegram.py raw --days 45 --budget 45
        timeout-minutes: 60
        continue-on-error: true
      - name: Sauvegarder le cache (même en cas d'échec ou d'expiration)
        if: always()
        uses: actions/cache/save@v4
        with: { path: raw, key: "raw-${{ github.run_id }}" }

      - name: Construire les feux
        run: python scripts/build.py raw
        timeout-minutes: 10
        continue-on-error: true
      - name: Construire les couches OSINT
        run: python scripts/build_osint.py raw
        timeout-minutes: 5
        continue-on-error: true
      - name: "Frappes ukrainiennes signalées sur la Russie et les zones occupées : agrégats par région et par mois"
        run: python scripts/build_strikes_ru.py raw
        timeout-minutes: 10
        continue-on-error: true
      - name: "Signaux Telegram : agrégats par tronçon de 24 km, par mois et par décade (aucun texte, décalage J-7)"
        run: python scripts/build_telegram_layer.py raw raw/viina
        timeout-minutes: 15
        continue-on-error: true
      - name: "Telegram quotidien par maille de 2 km (data/daily : seuls les jours couverts par la collecte des 45 derniers jours sont recalculés)"
        run: python scripts/build_daily_telegram.py raw raw/viina
        timeout-minutes: 15
        continue-on-error: true
      - name: Extraire et géocoder les annonces (faits seulement)
        run: python scripts/build_claims.py raw raw/viina
        timeout-minutes: 15
        continue-on-error: true
      - name: "Faits des bilans quotidiens (état-major UA, MoD RF) : agrégats par maille et par mois"
        run: python scripts/build_official_signals.py raw raw/viina
        timeout-minutes: 10
        continue-on-error: true
      - name: "Bilans officiels quotidiens par maille de 2 km (data/daily : 90 derniers jours recalculés)"
        run: python scripts/build_daily_officiels.py raw/viina raw/claims
        timeout-minutes: 10
        continue-on-error: true
      - name: "UCDP et WarSpotting quotidiens par maille de 2 km (data/daily : 90 derniers jours recalculés)"
        run: python scripts/build_daily_osint.py raw
        timeout-minutes: 10
        continue-on-error: true
      - name: "Ookla : débits fixes et mobiles par bloc, dernier trimestre (S3 public, CC BY-NC-SA 4.0)"
        run: python scripts/fetch_ookla.py
        timeout-minutes: 10
        continue-on-error: true

      - name: "Partager les couches construites (site/ + data/) avec la matrice front et l'assemblage"
        uses: actions/upload-artifact@v4
        with:
          name: work
          path: |
            site
            data
          include-hidden-files: true
          retention-days: 1

  front:
    needs: collecte
    runs-on: ubuntu-latest   # GitHub cloud — plus de dépendance au Mac. setup-python fournit Python 3.12 ; Chrome préinstallé. Le contrôle i18n (rendu UK/RU) est délégué à controle-i18n.yml (UAF_SKIP_I18N dans assemble)
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        lot: [vues, sens, sans_dsm, sans_isw, sans_wiki, sans_enveloppes, sans_medias, sans_modru, sans_gsua, sans_presence, sans_indices]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: "Dépendances (nowcast : calcul matriciel ; PyYAML : validation des workflows)"
        run: python -m pip install --disable-pip-version-check numpy==2.3.5 scipy==1.16.3 pyarrow==21.0.0 pyyaml
      - name: Restaurer le cache des données brutes (VIINA etc.)
        uses: actions/cache/restore@v4
        with: { path: raw, key: "raw-${{ github.run_id }}", restore-keys: "raw-" }
      - name: "Récupérer les couches construites (site/ + data/)"
        uses: actions/download-artifact@v4
        with: { name: work, path: . }
      - name: "Construire la carte du front — lot ${{ matrix.lot }} (mois, puis un pas tous les 3 jours sur les 90 derniers jours)"
        run: python scripts/build_front.py raw/viina
        env: { DAILY_DAYS: "90", FRONT_VIEWS: "${{ matrix.lot }}", HIST: "${{ matrix.lot == 'vues' && 'jours' || '' }}", HIST_BUDGET_MIN: "15", HIST_FROM: "2025-01" }
        timeout-minutes: 120
      - name: "Mettre le lot en paquet pour l'assemblage"
        run: python scripts/front_parts.py stage staging
      - name: "Publier le morceau du lot ${{ matrix.lot }}"
        uses: actions/upload-artifact@v4
        with:
          name: "front-${{ matrix.lot }}"
          path: staging
          include-hidden-files: true
          retention-days: 1

  assemble:
    needs: [collecte, front]
    runs-on: ubuntu-latest   # GitHub cloud — plus de dépendance au Mac. setup-python fournit Python 3.12 ; Chrome préinstallé. Le contrôle i18n (rendu UK/RU) est délégué à controle-i18n.yml (UAF_SKIP_I18N dans assemble)
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: "Dépendances (nowcast : calcul matriciel ; PyYAML : validation des workflows)"
        run: python -m pip install --disable-pip-version-check numpy==2.3.5 scipy==1.16.3 pyarrow==21.0.0 pyyaml
      - name: Restaurer le cache des données brutes
        uses: actions/cache/restore@v4
        with: { path: raw, key: "raw-${{ github.run_id }}", restore-keys: "raw-" }
      - name: "Récupérer les couches construites (site/ + data/)"
        uses: actions/download-artifact@v4
        with: { name: work, path: . }
      - name: "Récupérer tous les morceaux de la matrice front"
        uses: actions/download-artifact@v4
        with: { pattern: "front-*", path: parts_in, merge-multiple: true }
      - name: "Assembler front.js (surfaces des variantes par date + sensibilité ; identique au passage unique)"
        run: python scripts/front_parts.py assemble parts_in
        timeout-minutes: 10

      - name: "Modèle de sens à deux étages (poussée russe probable, poussée possible) : décades"
        run: python scripts/build_direction.py
        timeout-minutes: 10
        continue-on-error: true
      - name: "Moteur de fusion (vue de test parallèle) : un modèle d'observation par signal, poids réappris chaque mois"
        run: python scripts/build_fusion.py
        timeout-minutes: 20
        continue-on-error: true
      - name: "Variation des km² (estimateur débruité, erreur empirique recalculée)"
        run: python scripts/build_kmchange.py
        timeout-minutes: 5
        continue-on-error: true
      - name: "Avancée possible d'ici 2 mois : fourchettes par tronçon (affichées seulement si la validation passe)"
        run: python scripts/build_advance.py
        timeout-minutes: 10
        continue-on-error: true

      - name: Empreintes anti-cache de toutes les pages
        run: python scripts/stamp.py
        continue-on-error: true
      - name: Contrôle des flèches (base sur la ligne 50 %, angle < 30°)
        id: check
        env: { UAF_SKIP_I18N: "1" }   # rendu i18n UK/RU délégué à controle-i18n.yml ; la légende 4 langues reste contrôlée ici (check_legend)
        run: |
          set -o pipefail
          python scripts/check_arrows.py 2>&1 | tee data/controle_fleches.txt
        timeout-minutes: 40
        continue-on-error: true
      - name: Publier seulement le rapport du contrôle s'il échoue (lisible sans connexion à GitHub)
        if: steps.check.outcome == 'failure'
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/controle_fleches.txt
          git commit -m "Contrôle des flèches en échec du $(date -u +%F) : rapport seul, données non publiées" || exit 0
          git pull --rebase --autostash -X theirs origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"
      - name: Versionner les sorties
        if: steps.check.outcome == 'success'
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/ site/
          if git diff --cached --quiet; then echo "rien de neuf"; exit 0; fi
          git commit -m "Données du $(date -u +%F)"
          for i in 1 2 3; do
            if git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
            echo "essai $i échoué, nouvel essai dans 15 s"; sleep 15
          done
          exit 1

  deploy:
    needs: assemble
    if: always() && github.ref_name == 'main'   # ne déployer sur Pages que depuis main (les runs de branche de test ne touchent pas le site public)
    runs-on: ubuntu-latest   # deploy Pages sur GitHub cloud
    timeout-minutes: 15
    environment: { name: github-pages, url: "${{ steps.pages.outputs.page_url }}" }
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.ref_name }}" }
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - id: pages
        uses: actions/deploy-pages@v4
